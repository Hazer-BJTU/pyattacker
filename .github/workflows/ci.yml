name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two versions declared in pyproject.toml classifiers.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # The only third-party action in the pipeline, so it carries a commit pin: setup-uv stopped
        # publishing floating major tags at v8, and pinning to the commit is what its README now
        # recommends. The actions/* above and below are GitHub's own and track a major tag.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Test
        # The whole suite is offline; network access is never needed.
        run: uv run pytest

      - name: CLI smoke test
        run: uv run pyattacker demo --pipelines 25 --store runs/demo.db

      - name: Example smoke tests
        # The examples are documentation, and documentation rots: the llm_eval demo also asserts
        # its own claim about checkpoint granularity, so this catches recovery regressions.
        run: |
          uv run python examples/quickstart.py
          uv run python examples/sharded.py
          uv run python -m examples.llm_eval.demo

      - name: Build sdist and wheel
        run: uv build

      - name: Check the sdist stays lean
        # The cap release.yml also enforces before it uploads. Catching a 1.26 MB tarball in the pull
        # request that added the bytes is cheaper than catching it on the tag: 0.2.0 published one.
        run: |
          size=$(stat -c %s dist/*.tar.gz)
          if [ "$size" -gt 1048576 ]; then
            echo "::error::the sdist is $size bytes, over the 1 MiB cap; see the include list in pyproject.toml"
            tar tzvf dist/*.tar.gz | sort -k3 -n -r | head -5
            exit 1
          fi
          echo "sdist is $size bytes, under the 1 MiB cap"

  no-extra:
    name: base install, no yaml extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          # Both 3.11 jobs read the same lockfile, so without a suffix they compute the same cache
          # key and setup-uv warns that one of them could not upload the cache it just built. The
          # suffix is also honest: this job installs a different set of packages (pytest and the
          # build backend, rather than the dev group).
          cache-suffix: no-extra
          python-version: "3.11"

      - name: Install the library and nothing else
        # Deliberately not `uv sync`: the dev group carries the yaml extra, and doing without it is
        # the entire point of this job. Installing into /tmp keeps the venv out of the checkout.
        run: |
          uv venv /tmp/no-extra --python 3.11
          uv pip install --python /tmp/no-extra/bin/python . pytest

      - name: PyYAML really is absent, and importing pyattacker does not want it
        run: |
          /tmp/no-extra/bin/python -c "
          import importlib.util, sys
          assert importlib.util.find_spec('yaml') is None, 'pyyaml leaked into the base install'
          import pyattacker
          assert 'yaml' not in sys.modules, 'importing pyattacker pulled in pyyaml'
          print('pyattacker imports cleanly with no pyyaml installed')
          "

      - name: The suite passes without it
        # The `requires_yaml` tests are deselected rather than skipped, so an accidental loss of the
        # extra in the *development* environment fails the ordinary suite instead of quietly skipping
        # a third of it. The optional-dependency tests above are not marked, and run here for real.
        run: /tmp/no-extra/bin/python -m pytest -q -m "not requires_yaml"

      - name: A YAML config asks for the extra, a JSON one does not
        run: |
          /tmp/no-extra/bin/pyattacker --version
          mkdir -p /tmp/no-extra-check
          /tmp/no-extra/bin/pyattacker demo --pipelines 10 --store /tmp/no-extra-check/demo.db
          printf 'pipeline:\n  name: x\n  tasks:\n    - {use: echo}\n' > /tmp/no-extra-check/x.yaml
          printf '{"pipeline": {"name": "x", "tasks": [{"use": "echo"}]}}' > /tmp/no-extra-check/x.json
          if /tmp/no-extra/bin/pyattacker validate -c /tmp/no-extra-check/x.yaml 2>/tmp/no-extra-check/err.txt; then
            echo "::error::a YAML config was accepted without the extra installed"
            exit 1
          fi
          grep -q 'pyattacker\[yaml\]' /tmp/no-extra-check/err.txt || {
            echo "::error::the YAML error does not name the extra to install"
            cat /tmp/no-extra-check/err.txt
            exit 1
          }
          /tmp/no-extra/bin/pyattacker validate -c /tmp/no-extra-check/x.json > /dev/null
          echo "yaml asked for the extra; json validated"
