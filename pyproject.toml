[project]
name = "pyattacker"
version = "0.0.1"
description = "Artifact-centric, resumable async task orchestration: pipeline / task / resource pool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pyattacker contributors" }]
keywords = ["async", "orchestration", "pipeline", "artifact", "resource-pool", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
pyattacker = "pyattacker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyattacker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
