[project]
name = "pyattacker"
version = "0.3.2"
description = "Artifact-centric, resumable async task orchestration: pipeline / task / resource pool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pyattacker contributors" }]
keywords = ["async", "orchestration", "pipeline", "artifact", "resource-pool", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The kernel is the standard library only, and the declarative layer reads JSON and TOML with the
# standard library too, so the base install pulls in nothing at all. PyYAML is the one optional extra
# (below): only a .yaml/.yml config needs it, and the loader raises a message naming this extra when
# it is missing.
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/Hazer-BJTU/pyattacker"
Repository = "https://github.com/Hazer-BJTU/pyattacker"
Issues = "https://github.com/Hazer-BJTU/pyattacker/issues"
Changelog = "https://github.com/Hazer-BJTU/pyattacker/blob/main/CHANGELOG.md"
Documentation = "https://hazer-bjtu.github.io/pyattacker/"
Design = "https://github.com/Hazer-BJTU/pyattacker/blob/main/docs/design.md"

[project.scripts]
pyattacker = "pyattacker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # The optional extra, installed for development so that `uv run pytest` exercises the YAML path
    # as well. The CI job that installs the base package only deselects the tests marked
    # `requires_yaml` (below) instead of relying on them to skip.
    "pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["examples/plugin_package"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Deliberate style decisions, not oversights:
#   E501  long lines are allowed up to `line-length`; prose in docstrings is not wrapped by a tool
#   BLE001/S110  event sinks and best-effort cleanup must never take the scheduler down
#   RUF022  __all__ is grouped by concept (core objects, algorithms, stores, ...), not alphabetised
#   UP037  quoted annotations stay quoted where they document a forward reference
#   B008  dataclass defaults calling a factory (field(default_factory=...)) are the normal idiom here
#   UP042  (str, Enum) is deliberate: `str(member)` stays "ResourceState.READY" in logs, while the
#         wire format uses `.value` explicitly
ignore = ["E501", "BLE001", "S110", "RUF022", "UP037", "B008", "PYI036", "PYI034", "UP042"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyattacker"]

[tool.hatch.build.targets.sdist]
# An sdist should be able to rebuild and verify the package, so tests, docs and examples belong in
# it. Local tooling state does not: .claude/ is untracked editor config, and shipping it in a
# release leaks whatever a contributor happens to have configured locally.
#
# assets/ is deliberately absent. The README loads its banner over an absolute
# raw.githubusercontent.com URL, so nothing that unpacks this sdist needs the images, and the two
# logo files were 883 KB of pyattacker-0.2.0.tar.gz's 1.26 MB: PNG barely compresses, so most of a
# file whose purpose is to be rebuilt and tested was branding. Both workflows cap the sdist at
# 1 MiB, so putting a binary back in this list fails the build rather than a download.
include = [
    "src/pyattacker",
    "tests",
    "docs",
    "examples",
    "README.md",
    # The Chinese README is part of the documentation set the tests verify: test_docs_i18n.py checks
    # that every document in its PAIRS table has a Chinese counterpart, and an sdist that ships the
    # tests but not this file would fail its own suite.
    "README.zh-CN.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
    "mkdocs.yml",
    ".github/workflows",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Reading a .yaml config is the one thing that needs the optional extra. Those tests are marked rather
# than guarded with importorskip() so that the development suite *fails* when PyYAML goes missing
# instead of quietly skipping a third of itself; the bare-install CI job deselects them explicitly with
# `pytest -m "not requires_yaml"`. Registering the marker (and --strict-markers) keeps a typo from
# silently turning into a no-op.
markers = [
    "requires_yaml: drives the declarative layer through a .yaml file, so it needs the optional `yaml` extra (pyyaml)",
]

# Keep lockfile download URLs portable across local machines and GitHub runners.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
