# A minimal third-party plugin package: install it and its tasks/algorithms/codecs become
# available by name in any pyattacker config.
#
#   uv pip install -e examples/plugin_package --no-deps
#   uv run pyattacker plugins
#   uv run pyattacker run -c examples/plugin_tasks.yaml
[project]
name = "pa-demo-plugin"
version = "0.1.0"
description = "Example pyattacker plugin: tasks, an acquisition algorithm and a codec."
requires-python = ">=3.11"
# A real plugin would declare `dependencies = ["pyattacker>=0.1"]`; this example is installed from
# the repository itself, so it relies on the surrounding environment instead.
dependencies = []

[project.entry-points."pyattacker.tasks"]
word_count = "pa_demo_plugin.tasks:word_count"
uppercase_answer = "pa_demo_plugin.tasks:uppercase_answer"

[project.entry-points."pyattacker.algorithms"]
least_loaded = "pa_demo_plugin.algorithms:LeastLoaded"

[project.entry-points."pyattacker.codecs"]
csv_row = "pa_demo_plugin.codecs:CsvRowCodec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pa_demo_plugin"]
